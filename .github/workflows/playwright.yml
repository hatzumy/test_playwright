name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browsers: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test --grep-invert "tests\register.spec.ts"
      - name: login test execution on ${{ matrix.browsers }}
        run: npx playwright test --grep-invert "tests\register.spec.ts" --project=${{ matrix.browsers }}
      - name: Subir Reporte HTML como Artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browsers }}
          path: playwright-report/
          retention-days: 7

